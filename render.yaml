# Render blueprint - deploys the scanner API + admin console as one service.
#
#   1. push this repo to GitHub
#   2. open the deploy button in DEPLOY.md, or
#      Render dashboard -> New -> Blueprint -> pick this repo
#   3. type one admin password, Render does the rest
#
# The image needs 2 GB RAM (torch + easyocr), so the free tier is not enough.

services:
  - type: web
    name: complianceai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_PATH
        value: /data/compliance.db
      - key: UPLOAD_FOLDER
        value: /data/uploads
      - key: REPORTS_FOLDER
        value: /data/reports
      - key: EASYOCR_MODULE_PATH
        value: /data/easyocr
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # the only value you have to type
      - key: CORS_ORIGINS
        value: https://complianceai-henna.vercel.app
      - key: PUBLIC_API_URL
        value: https://complianceai-api.onrender.com
      - key: PUBLIC_ADMIN_URL
        value: https://complianceai-api.onrender.com/admin
      - key: PORTFOLIO_URL
        value: https://complianceai-henna.vercel.app
    disk:
      name: complianceai-data
      mountPath: /data
      sizeGB: 1
